server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — route all non-file requests to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever (Vite injects content hashes in filenames)
    location ~* \.(js|css|woff2?|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry point — browser must re-fetch it to pick up new hashes
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
