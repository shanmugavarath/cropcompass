services:

  # ── PostgreSQL 15 + pgvector ─────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: cropcompass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cropcompass}
      POSTGRES_USER:     ${POSTGRES_USER:-cropcompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropcompass_secret}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cropcompass} -d ${POSTGRES_DB:-cropcompass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── DB MCP server (port 9101) ─────────────────────────────────
  db-mcp:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    container_name: cropcompass-db-mcp
    restart: unless-stopped
    command: uvicorn mcp_servers.db_server.server:app --host 0.0.0.0 --port 9101
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cropcompass}:${POSTGRES_PASSWORD:-cropcompass_secret}@db:5432/${POSTGRES_DB:-cropcompass}
    ports:
      - "9101:9101"
    depends_on:
      db:
        condition: service_healthy

  # ── Vector MCP server (port 9102) ─────────────────────────────
  vector-mcp:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    container_name: cropcompass-vector-mcp
    restart: unless-stopped
    command: uvicorn mcp_servers.vector_server.server:app --host 0.0.0.0 --port 9102
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-cropcompass}:${POSTGRES_PASSWORD:-cropcompass_secret}@db:5432/${POSTGRES_DB:-cropcompass}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "9102:9102"
    depends_on:
      db:
        condition: service_healthy

  # ── IMD API service (port 8000) ───────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cropcompass-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-cropcompass}:${POSTGRES_PASSWORD:-cropcompass_secret}@db:5432/${POSTGRES_DB:-cropcompass}
      AGENT_SERVICE_URL: http://agent:8001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_API_KEY:        ${HF_API_KEY:-}
      LOG_LEVEL:         ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Agent service (port 8001) ─────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: cropcompass-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      LLM_BACKEND:        ${LLM_BACKEND:-lm_studio}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234
      LM_STUDIO_MODEL:    ${LM_STUDIO_MODEL:-local-model}
      HF_API_KEY:         ${HF_API_KEY:-}
      MCP_SERVER_URLS:    http://db-mcp:9101,http://vector-mcp:9102
      SESSION_BACKEND:    ${SESSION_BACKEND:-postgres}
      DATABASE_URL:       postgresql://${POSTGRES_USER:-cropcompass}:${POSTGRES_PASSWORD:-cropcompass_secret}@db:5432/${POSTGRES_DB:-cropcompass}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-*}
      INDIC_EN_MODEL:     ${INDIC_EN_MODEL:-ai4bharat/indictrans2-indic-en-1B}
      EN_INDIC_MODEL:     ${EN_INDIC_MODEL:-ai4bharat/indictrans2-en-indic-1B}
    volumes:
      - chromadb_data:/app/data/chromadb
    depends_on:
      db-mcp:
        condition: service_started
      vector-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── One-shot ChromaDB ingestion ───────────────────────────────
  # Usage: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: cropcompass-ingest
    command: python -m ingestion.ingest_to_chromadb
    volumes:
      - chromadb_data:/app/data/chromadb
      - ./data/raw:/app/data/raw:ro
    profiles:
      - tools

volumes:
  pg_data:
  chromadb_data:
